<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gu-accent-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="gu-accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="gu-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#gu-bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.5"/>

  <!-- Growth Nodes & Paths (Idea to Scale trajectory) -->
  <g filter="url(#gu-glow)">
    <!-- Ascending Growth Path (G & Up Arrow hybrid) -->
    <path d="M14 44 C 14 44, 20 44, 25 36 C 30 28, 35 32, 42 21 L 49 14" stroke="url(#gu-accent-blue)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bold Main Ascending Chevron / Arrowhead -->
    <path d="M37 14 L 50 14 L 50 27" stroke="url(#gu-accent-green)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Secondary Dynamic Scale Wing -->
    <path d="M18 48 C 24 48, 29 42, 36 34 L 43 27" stroke="url(#gu-accent-green)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Luminous Pulsing Node Points -->
    <circle cx="14" cy="44" r="3.5" fill="#38bdf8"/>
    <circle cx="28" cy="32" r="3.5" fill="#22c55e"/>
    <circle cx="50" cy="14" r="4" fill="#4ade80"/>
  </g>
</svg>
